<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0a0a08"/>

  <!-- Top-left bracket arm — acid green -->
  <rect x="7" y="7" width="7" height="2" rx="1" fill="#c8f04a"/>
  <rect x="7" y="7" width="2" height="7" rx="1" fill="#c8f04a"/>

  <!-- Bottom-right bracket arm — violet -->
  <rect x="18" y="23" width="7" height="2" rx="1" fill="#e04aff"/>
  <rect x="23" y="18" width="2" height="7" rx="1" fill="#e04aff"/>

  <!-- Diagonal connector -->
  <line x1="10" y1="22" x2="22" y2="10" stroke="#3a3a36" stroke-width="1.5" stroke-linecap="round"/>
</svg>
