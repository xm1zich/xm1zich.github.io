<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a0e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ff47" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8ff47" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.07" stroke="#e8ff47" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Glow pool behind vault -->
  <ellipse cx="256" cy="272" rx="160" ry="120" fill="url(#vaultGlow)"/>

  <!-- Vault door body -->
  <rect x="136" y="152" width="240" height="240" rx="12" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Vault door outer ring -->
  <circle cx="256" cy="272" r="88" fill="none" stroke="#222" stroke-width="12"/>
  <circle cx="256" cy="272" r="88" fill="none" stroke="#e8ff47" stroke-width="2" opacity="0.6" filter="url(#softglow)"/>

  <!-- Vault door inner ring -->
  <circle cx="256" cy="272" r="62" fill="none" stroke="#1e1e1e" stroke-width="8"/>
  <circle cx="256" cy="272" r="62" fill="none" stroke="#e8ff47" stroke-width="1.5" opacity="0.35"/>

  <!-- Inner disc -->
  <circle cx="256" cy="272" r="48" fill="#0f0f0f"/>
  <circle cx="256" cy="272" r="48" fill="none" stroke="#e8ff47" stroke-width="1" opacity="0.2"/>

  <!-- Dial spokes (6 spokes at 60° intervals) -->
  <g stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#softglow)">
    <line x1="256" y1="230" x2="256" y2="224"/>
    <line x1="256" y1="314" x2="256" y2="320"/>
    <line x1="219.1" y1="251" x2="214" y2="248.1"/>
    <line x1="292.9" y1="293" x2="298" y2="295.9"/>
    <line x1="219.1" y1="293" x2="214" y2="295.9"/>
    <line x1="292.9" y1="251" x2="298" y2="248.1"/>
  </g>

  <!-- Center knob -->
  <circle cx="256" cy="272" r="10" fill="#1a1a0e" stroke="#e8ff47" stroke-width="2" filter="url(#softglow)"/>
  <circle cx="256" cy="272" r="4" fill="#e8ff47" opacity="0.9"/>

  <!-- Handle bar -->
  <rect x="316" y="256" width="32" height="32" rx="6" fill="#111" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="322" y="262" width="20" height="20" rx="4" fill="none" stroke="#e8ff47" stroke-width="1.5" opacity="0.6"/>

  <!-- Corner bolts -->
  <circle cx="160" cy="176" r="7" fill="#161616" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="352" cy="176" r="7" fill="#161616" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="160" cy="368" r="7" fill="#161616" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="352" cy="368" r="7" fill="#161616" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Bolt cross marks -->
  <g stroke="#333" stroke-width="1.5" stroke-linecap="round">
    <line x1="157" y1="176" x2="163" y2="176"/>
    <line x1="160" y1="173" x2="160" y2="179"/>
    <line x1="349" y1="176" x2="355" y2="176"/>
    <line x1="352" y1="173" x2="352" y2="179"/>
    <line x1="157" y1="368" x2="163" y2="368"/>
    <line x1="160" y1="365" x2="160" y2="371"/>
    <line x1="349" y1="368" x2="355" y2="368"/>
    <line x1="352" y1="365" x2="352" y2="371"/>
  </g>

  <!-- Top label strip -->
  <rect x="136" y="152" width="240" height="28" rx="12" fill="#0d0d0d"/>
  <rect x="136" y="165" width="240" height="15" fill="#0d0d0d"/>

  <!-- "VAULT" text in strip -->
  <text x="256" y="171" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#e8ff47" letter-spacing="6" opacity="0.85">VAULT</text>

  <!-- Accent line bottom -->
  <rect x="168" y="372" width="176" height="2" rx="1" fill="#e8ff47" opacity="0.15"/>

  <!-- Subtle corner glow -->
  <rect x="136" y="152" width="240" height="240" rx="12" fill="none" stroke="#e8ff47" stroke-width="1" opacity="0.08"/>
</svg>
